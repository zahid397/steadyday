# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Applying this Blueprint creates a public API endpoint. Review the plan before applying.
services:
  - type: web
    name: steadyday-api
    runtime: docker
    branch: main
    region: singapore
    plan: free
    autoDeployTrigger: 'off'
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: '8000'
      - key: STEADYDAY_MODE
        value: hosted
      - key: DATABASE_URL
        fromDatabase:
          name: steadyday-postgres
          property: connectionString
      - key: PROXY_KEY
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: DEMO_TIMEZONE
        value: Asia/Dhaka
      - key: DEMO_SESSION_DAYS
        value: '7'
      - key: DEMO_SESSION_LIMIT
        value: '300'
      - key: RETRIEVAL_ENABLED
        value: '1'

databases:
  - name: steadyday-postgres
    region: singapore
    plan: free
    postgresMajorVersion: '16'
    databaseName: steadyday
    ipAllowList: []
