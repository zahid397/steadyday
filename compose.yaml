name: steadyday

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-steadyday}
  POSTGRES_DB: ${POSTGRES_DB:-steadyday}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}

services:
  app:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    init: true
    restart: unless-stopped
    environment:
      <<: *postgres-env
      POSTGRES_HOST: db
      STEADYDAY_MODE: local
      DEMO_TIMEZONE: ${DEMO_TIMEZONE:-Asia/Dhaka}
      DEMO_SESSION_DAYS: ${DEMO_SESSION_DAYS:-7}
      DEMO_SESSION_LIMIT: ${DEMO_SESSION_LIMIT:-300}
      RETRIEVAL_ENABLED: ${RETRIEVAL_ENABLED:-1}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=3); c.request('GET','/healthz'); raise SystemExit(c.getresponse().status != 200)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  db:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    environment: *postgres-env
    volumes:
      - steadyday_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 4s
      timeout: 3s
      retries: 15
      start_period: 15s

volumes:
  steadyday_data:
