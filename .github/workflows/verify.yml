name: Verify SteadyDay

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements-postgres.txt -r server/requirements-test.txt pip-audit ruff
      - name: Check Python and browser JavaScript
        run: |
          ruff check --select E9,F63,F7,F82 server tests scripts
          for file in web/public/steadyday/*.js; do node --check "$file" || exit; done
      - name: Audit runtime Python dependencies
        run: pip-audit -r server/requirements-postgres.txt
      - name: Test API and proxy
        run: |
          python -m unittest discover -s tests -p 'test_*api.py' -v
          python tests/run_proxy_tests.py
      - name: Test in Chromium
        env:
          STEADYDAY_EVIDENCE_DIR: ${{ runner.temp }}/steadyday-evidence
        run: |
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests -p 'test_browser.py' -v
      - name: Install, build and audit frontend
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL and SteadyDay
        run: |
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          sed "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$password/" .env.example > .env
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 120
      - name: Test the app against PostgreSQL
        run: docker compose exec -T app python scripts/smoke.py
      - name: Show service diagnostics on failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Stop services
        if: always()
        run: docker compose down
